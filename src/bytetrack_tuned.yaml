# ByteTrack tuned for this camera: every 3rd frame of 30 fps footage, many small pedestrians.
# Stricter track creation cuts ID churn; a longer buffer bridges occlusions behind poles and buses.
tracker_type: bytetrack
track_high_thresh: 0.3
track_low_thresh: 0.1
new_track_thresh: 0.4
track_buffer: 60
match_thresh: 0.8
fuse_score: True
